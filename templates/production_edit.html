{% extends 'base.html' %}
{% block title %}Edit production{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">Productions</p><h1>Edit {{ production.title }}</h1></div><a href="{{ url_for('productions') }}">Back to productions</a></div><div class="form-page"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Title <input name="title" required maxlength="160" value="{{ request.form.get('title', production.title) }}"></label><label>Notes <textarea name="notes" rows="5" maxlength="1000">{{ request.form.get('notes', production.notes) }}</textarea></label><button class="button primary" type="submit">Save changes</button></form></div>{% endblock %}
