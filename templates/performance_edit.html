{% extends 'base.html' %}
{% block title %}Edit performance{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">Performance</p><h1>Edit schedule</h1></div><a href="{{ url_for('performance', performance_id=performance.id) }}">Back to roster</a></div><div class="form-page"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Production <select name="production_id" required>{% for item in productions %}<option value="{{ item.id }}" {% if request.form.get('production_id', performance.production_id|string) == item.id|string %}selected{% endif %}>{{ item.title }}</option>{% endfor %}</select></label><label>Date and time <input name="starts_at" type="datetime-local" required value="{{ request.form.get('starts_at', performance.starts_at) }}"></label><label>Venue <input name="venue" maxlength="160" value="{{ request.form.get('venue', performance.venue) }}"></label><button class="button primary" type="submit">Save changes</button></form></div>{% endblock %}
