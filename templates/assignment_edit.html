{% extends 'base.html' %}
{% block title %}Change assignment{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">Crew roster</p><h1>Change assignment</h1></div><a href="{{ url_for('performance', performance_id=assignment.performance_id) }}">Back to roster</a></div><div class="form-page"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Role <select name="role" required>{% for role in roles %}<option value="{{ role }}" {% if request.form.get('role', assignment.role) == role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select></label><label>Volunteer <select name="volunteer_id" required>{% for item in volunteers %}<option value="{{ item.id }}" {% if request.form.get('volunteer_id', assignment.volunteer_id|string) == item.id|string %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label><button class="button primary" type="submit">Save assignment</button></form></div>{% endblock %}
